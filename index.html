<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Thuso — Safe Community Support & Counselling</title>
    <meta
      name="description"
      content="A safe, judgement-free conversational support space with Thuso, a South African community mentor and counsellor supporting youth and families affected by crime and substance abuse."
    />
    <meta property="og:title" content="Thuso — Safe Community Support & Counselling" />
    <meta
      property="og:description"
      content="A safe, judgement-free conversational support space with Thuso, a South African community mentor and counsellor supporting youth and families affected by crime and substance abuse."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('thuso_theme_v2');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#5f6cd6] text-white font-sans antialiased selection:bg-white/25 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
